####################################
# native_sim + Improv (BLE) + simulated Wi-Fi
####################################
#
# Emulator target: runs the improv-zephyr BLE (GATT) provisioning service using
# the HOST Bluetooth adapter via native_sim's HCI User Channel driver
# (zephyr,bt-hci = &bt_hci_userchan, default on native_sim). Advertises as an
# Active ESL e-ink board (`eink-51F0`) so the Active ESL Flutter app can
# discover/provision/claim it without an app change. Wi-Fi association is
# simulated by CONFIG_APP_WIFI_SIM → TAP DHCPv4 → Mender. Host build only.
#
# Running requires CAP_NET_ADMIN (sudo or setcap) and a host adapter that is
# powered down so the kernel hands it to the User Channel. See
# scripts/run-native-sim-improv-ble.sh.

####################################
# Improv protocol + BLE transport (serial off)
####################################
CONFIG_IMPROV_WIFI=y
CONFIG_IMPROV_SERIAL=n
CONFIG_IMPROV_BLE=y
CONFIG_IMPROV_FIRMWARE_NAME="mender-native-sim"
CONFIG_IMPROV_FIRMWARE_VERSION="dev-1"
CONFIG_IMPROV_DEVICE_NAME="eink-51F0"
CONFIG_IMPROV_REDIRECT_URL="https://active-esl-onboard.active-esl.workers.dev?ip_address={ip}&token={token}"

####################################
# Bluetooth peripheral (controller = host adapter via HCI User Channel)
####################################
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="eink-51F0"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_GATT_DYNAMIC_DB=y
# No bonding persistence needed for provisioning; keep NVS clear for Mender.
CONFIG_BT_SETTINGS=n

# Raise the ATT MTU so a 64-byte PSK arrives in a single RPC-command write.
CONFIG_BT_L2CAP_TX_MTU=128
CONFIG_BT_BUF_ACL_RX_SIZE=132
CONFIG_BT_BUF_ACL_TX_SIZE=132

####################################
# Simulated Wi-Fi management interface (app driver: src/net/wifi_sim.c)
####################################
CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_APP_WIFI_SIM=y

####################################
# Real data path: native TAP Ethernet + DHCPv4 (started on provisioning)
####################################
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_DHCPV4=y

# Entropy for {token} minting (sys_rand32_get)
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_TIMER_RANDOM_GENERATOR=y
