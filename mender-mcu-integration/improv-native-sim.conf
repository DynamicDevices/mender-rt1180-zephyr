####################################
# native_sim + Improv (serial) + simulated Wi-Fi
####################################
#
# Emulator target: runs the improv-zephyr provisioning handshake over the
# native_sim console PTY, then brings the real native TAP Ethernet interface up
# (DHCPv4) so the Mender client connects end-to-end. No emulated radio exists, so
# the "Wi-Fi" interface here (CONFIG_APP_WIFI_SIM) is management-only; the TAP
# interface carries all data. Host build only; not for real hardware.

####################################
# Improv protocol + serial transport
####################################
CONFIG_IMPROV_WIFI=y
CONFIG_IMPROV_SERIAL=y
CONFIG_IMPROV_BLE=n
CONFIG_IMPROV_FIRMWARE_NAME="mender-native-sim"
CONFIG_IMPROV_FIRMWARE_VERSION="dev-1"
CONFIG_IMPROV_DEVICE_NAME="native_sim Improv"
CONFIG_IMPROV_REDIRECT_URL=" "

####################################
# Simulated Wi-Fi management interface (app driver: src/net/wifi_sim.c)
####################################
CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_APP_WIFI_SIM=y

####################################
# Real data path: native TAP Ethernet + DHCPv4 (started on provisioning)
####################################
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_DHCPV4=y

####################################
# Serial transport shares the console UART (own PTY on native_sim)
####################################
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
