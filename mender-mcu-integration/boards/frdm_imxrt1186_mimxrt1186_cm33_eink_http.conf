# Opt-in e-tabelone HTTP for FRDM e-ink (FRDM_EINK_HTTP=1).
#
# Path: HyperRAM as zephyr,sram + MCUboot DTCM + FlexSPI1 disabled
# (boards/..._eink_hyperram.conf). OCRAM enroll is too small for HTTP BSS.
#
#   FRDM_EINK_HTTP=1 ./scripts/build-rt1186-frdm-eink.sh
#
# Sync stays off until: eink creds <base> <id> <token> && eink sync
# Creds persist to LittleFS (/lfs1/eink/creds.json) across reboot by default.

CONFIG_APP_EINK_HTTP=y
CONFIG_APP_EINK_HTTP_JSON_ARENA_SIZE=32768
CONFIG_APP_EINK_HTTP_ENABLE=n
CONFIG_APP_EINK_HTTP_V2_SYNC=y
CONFIG_APP_EINK_HTTP_BASE_URL="https://etablone.dynamicdevices.co.uk"
CONFIG_APP_EINK_RESOURCE_TELEMETRY=y
# LZ4 decode needs flash headroom; keep on for CF delivery_format.
CONFIG_APP_EINK_LZ4=y
# Store .es6f.lz4 (not 960 KiB ES6F) — FRDM eink LittleFS is ~1.75 MiB.
CONFIG_APP_EINK_LZ4_EXPAND_ON_DISPLAY=y
# Demo campaigns have many slots; only pull the due frame on this board.
CONFIG_APP_EINK_HTTP_SKIP_GALLERY=y
CONFIG_SNTP=y
CONFIG_APP_EINK_HTTP_SNTP_SERVER="pool.ntp.org"
# Trim optional HTTP caches on constrained FRDM.
CONFIG_APP_EINK_HTTP_CONFIG_CACHE=n
CONFIG_APP_EINK_HTTP_FAST_PATH=n
# Modest system heap — do NOT size this for lz4js max4MB frames.
# Portal must emit ≤64 KiB LZ4 blocks (CLOUD-HANDOFF-LZ4-BLOCK-SIZE.md).
CONFIG_HEAP_MEM_POOL_SIZE=98304

