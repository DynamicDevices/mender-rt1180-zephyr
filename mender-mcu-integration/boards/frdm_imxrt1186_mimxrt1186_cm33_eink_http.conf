# Opt-in e-tabelone HTTP for FRDM e-ink (append via EXTRA_CONF / BOM-style env).
# First HTTP=y on default HyperRAM map hung at boot (garbled UART, no ping).
# Prefer: FRDM_ENROLL_OCRAM=1 ./scripts/build-rt1186-frdm-eink.sh with this file.
#
#   EXTRA: boards/frdm_imxrt1186_mimxrt1186_cm33_eink_http.conf
#
# Sync stays off until: eink creds <base> <id> <token> && eink sync

CONFIG_APP_EINK_HTTP=y
CONFIG_APP_EINK_HTTP_JSON_ARENA_SIZE=32768
CONFIG_APP_EINK_HTTP_ENABLE=n
CONFIG_APP_EINK_HTTP_V2_SYNC=y
CONFIG_APP_EINK_HTTP_BASE_URL="https://etablone.dynamicdevices.co.uk"
CONFIG_APP_EINK_RESOURCE_TELEMETRY=y
# LZ4 decode needs flash headroom; keep on for CF delivery_format.
CONFIG_APP_EINK_LZ4=y
CONFIG_SNTP=y
CONFIG_APP_EINK_HTTP_SNTP_SERVER="pool.ntp.org"
# Trim optional HTTP caches on constrained FRDM.
CONFIG_APP_EINK_HTTP_CONFIG_CACHE=n
CONFIG_APP_EINK_HTTP_FAST_PATH=n
CONFIG_HEAP_MEM_POOL_SIZE=98304
