####################################
# MIMXRT1170-EVKB + NXP 2EL (IW612)
# Improv Wi-Fi over BLE
####################################
#
# Hardware/driver status:
# - Requires an Embedded Artists 2EL M.2 module and NXP hal_nxp blobs.
# - Selects the same IW612 Wi-Fi/BT choices as nxp_m2_2el_wifi_bt, while the
#   companion app overlay supplies RT1170-specific SDIO mapping.
# - NXP documents EVKB HCI-UART hardware rework for the M.2 module.
# - This combination is host-build tested only until hardware arrives.

####################################
# Improv protocol and BLE transport
####################################
# Advertise as Active ESL e-ink (`eink-1170`) so the Active ESL app can claim.
CONFIG_IMPROV_WIFI=y
CONFIG_IMPROV_SERIAL=n
CONFIG_IMPROV_BLE=y
CONFIG_IMPROV_FIRMWARE_NAME="mender-rt1170"
CONFIG_IMPROV_FIRMWARE_VERSION="dev-1"
CONFIG_IMPROV_DEVICE_NAME="eink-1170"
CONFIG_IMPROV_REDIRECT_URL="https://active-esl-onboard.active-esl.workers.dev?ip_address={ip}&token={token}"

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_NXP_NW612=y
CONFIG_BT_DEVICE_NAME="eink-1170"
CONFIG_BT_MAX_CONN=1
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_SETTINGS=y
CONFIG_BT_L2CAP_TX_MTU=128
CONFIG_BT_BUF_ACL_RX_SIZE=132
CONFIG_BT_BUF_ACL_TX_SIZE=132

####################################
# NXP IW612 Wi-Fi over SDIO
####################################
CONFIG_WIFI=y
CONFIG_WIFI_NXP=y
CONFIG_NXP_MONOLITHIC_WIFI=y
CONFIG_NXP_IW61X=y
CONFIG_NXP_IW612_MURATA_2EL_M2=y
CONFIG_NET_L2_WIFI_MGMT=y

CONFIG_WIFI_NM=y
CONFIG_WIFI_CREDENTIALS=y
CONFIG_WIFI_CREDENTIALS_BACKEND_SETTINGS=y
CONFIG_WIFI_CREDENTIALS_CONNECT_STORED=y

####################################
# Credential persistence
####################################
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

####################################
# NXP hosted-MCU network resources
####################################
CONFIG_EVENTS=y
CONFIG_SYS_HEAP_AUTO=y
CONFIG_THREAD_LOCAL_STORAGE=y
CONFIG_NXP_WIFI_TX_TASK_PRIO=3
CONFIG_NXP_WIFI_TX_TASK_STACK_SIZE=4096

CONFIG_NET_PKT_RX_COUNT=80
CONFIG_NET_PKT_TX_COUNT=80
CONFIG_NET_BUF_RX_COUNT=160
CONFIG_NET_BUF_TX_COUNT=160
CONFIG_NET_BUF_DATA_SIZE=1600
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=16384
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=16384
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=40

CONFIG_NET_TC_THREAD_PRIO_CUSTOM=y
CONFIG_NET_TC_THREAD_PREEMPTIVE=y
CONFIG_NET_TCP_WORKER_PRIO=-16
CONFIG_NET_TC_TX_THREAD_BASE_PRIO=3
CONFIG_NET_TC_RX_THREAD_BASE_PRIO=3
CONFIG_NET_CONTEXT_PRIORITY=y
CONFIG_NET_MGMT_THREAD_PRIO_CUSTOM=y
CONFIG_NET_MGMT_THREAD_PRIORITY=3

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4608
CONFIG_NET_TCP_WORKQ_STACK_SIZE=2048
CONFIG_NET_SOCKETS_SERVICE_STACK_SIZE=4096
CONFIG_IDLE_STACK_SIZE=1024

CONFIG_SPEED_OPTIMIZATIONS=y
