# FRDM lab: BOM (TOSP) + BBNSM RTC power-check loop.
# Build: BOM_POWER_LOOP=1 ./scripts/build-rt1186-frdm-eink.sh
# Measure on DC jack; unplug J23/J63 after boot banner / settle window.
# Rebuild without BOM_POWER_LOOP to restore a normal shell image.

CONFIG_APP_EINK_BOM_POWER_LOOP=y
CONFIG_APP_EINK_BOM_POWER_LOOP_PRE_SEC=5
CONFIG_APP_EINK_BOM_POWER_LOOP_HOLD_SEC=10
