####################################
# FRDM e-ink — HyperRAM app (MCUboot in DTCM)
####################################
# F1 class: FlexSPI1 disabled in overlays; ROM XMCD owns HyperRAM;
# FlexSPI2 NOR HAL relocated into HyperRAM RAM_TEXT (RX MPU).

CONFIG_CODE_DATA_RELOCATION=y
CONFIG_CODE_DATA_RELOCATION_SRAM=y
CONFIG_FLASH_MCUX_FLEXSPI_XIP_MEM="RAM"

CONFIG_ASSERT=n

CONFIG_MAIN_STACK_SIZE=12288
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=8192
CONFIG_SHELL_STACK_SIZE=8192
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=4096
CONFIG_MBEDTLS_HEAP_SIZE=65536
