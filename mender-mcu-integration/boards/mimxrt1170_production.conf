####################################
# RT1170 Active ESL — production sketch
####################################
# Pair AFTER board base + product e-ink conf so these overrides win.
# Docs: boards/mimxrt1170_production.conf.md
# Not for lab bring-up (use *_shell / native_sim profiles instead).

# Attack surface: no interactive UART shell.
# CONFIG_SHELL is not set
# CONFIG_FILE_SYSTEM_SHELL is not set
# CONFIG_APP_EINK_SHELL is not set

# No boot selftest (CI / native_sim cover this).
# CONFIG_APP_EINK_SELFTEST is not set

# Etablone: Cloudflare radio-on-time sync. Never commit real tokens.
CONFIG_APP_EINK_HTTP=y
CONFIG_APP_EINK_HTTP_V2_SYNC=y
CONFIG_APP_EINK_HTTP_ENABLE=y
CONFIG_APP_EINK_HTTP_DEVICE_ID=""
CONFIG_APP_EINK_HTTP_AUTH_TOKEN=""

# SoC UID is device_id / Mender soc_uid when DEVICE_ID empty.
CONFIG_HWINFO=y
