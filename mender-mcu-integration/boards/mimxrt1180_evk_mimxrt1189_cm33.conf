####################################
# MIMXRT1180-EVK (CM33)
####################################

####################################
# NXP NETC Ethernet
####################################
CONFIG_ETH_NXP_IMX_NETC=y
CONFIG_NET_L2_ETHERNET=y

# RT1180 EVK exposes multiple NETC interfaces; 2 is enough for host-port DHCP bring-up
CONFIG_NET_IF_MAX_IPV4_COUNT=2

# Pre-hardware NETC download tuning (lab defaults, pending bench)
CONFIG_ETH_NXP_IMX_RX_RING_LEN=16
CONFIG_NET_PKT_RX_COUNT=40
CONFIG_NET_PKT_TX_COUNT=40
CONFIG_NET_BUF_RX_COUNT=120
CONFIG_NET_BUF_TX_COUNT=120
CONFIG_NET_BUF_DATA_SIZE=256
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=8192
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=8192

####################################
# MCUboot signing
####################################
CONFIG_MCUBOOT_SIGNATURE_KEY_FILE="bootloader/mcuboot/root-rsa-2048.pem"

####################################
# Mender storage (storage_partition in board DTS)
####################################
CONFIG_MENDER_STORAGE_PARTITION_STORAGE_PARTITION=y

# RT1180 CM33: no zephyr,entropy in upstream DTS yet; net/TLS need sys_rand_get
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_TIMER_RANDOM_GENERATOR=y

# Zephyr 4.4: CONFIG_MBEDTLS_ENTROPY_POLL_ZEPHYR -> CONFIG_MBEDTLS_PSA_DRIVER_GET_ENTROPY
# No zephyr,entropy in CM33 DTS yet; timer/test RNG feeds PSA entropy driver
CONFIG_MBEDTLS_PSA_DRIVER_GET_ENTROPY=y
