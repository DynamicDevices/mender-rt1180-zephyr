# RT1170 EVK panel-debug / SPI EL133 lab profile.
# Build: ./scripts/build-rt1170-evk-eink.sh
# Do not use with --shield rk055hdmipi4ma0 (LPSPI1 vs LCDIF conflict).
#
# Shell: same eink commands as native_sim (UART @ 115200 on MCU-Link).
CONFIG_APP_EINK=y
CONFIG_APP_EINK_SHELL=y
CONFIG_APP_EINK_FULL_FRAMEBUFFER=y
CONFIG_APP_EINK_DISPLAY_LCD_PREVIEW=n
CONFIG_APP_EINK_STORE_ROOT="/lfs1/eink"
CONFIG_DISPLAY=y
CONFIG_DUMMY_DISPLAY=y
CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FS_LITTLEFS_FSTAB_AUTOMOUNT=y
CONFIG_FILE_SYSTEM_SHELL=y
# CONFIG_EL133UF1 selected via DT when node enabled
# EVK debug heap — SDRAM-backed system RAM on this board target.
CONFIG_HEAP_MEM_POOL_SIZE=1048576
CONFIG_MAIN_STACK_SIZE=8192
# Explicitly not a battery profile.
CONFIG_APP_EINK_BATTERY_DUTY_CYCLE=n
