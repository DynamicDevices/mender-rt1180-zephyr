# Active ESL custom RT1170 board — product-shaped firmware fragment.
# Pair with mimxrt1170_custom_eink_flexspi2.overlay once the board DTS exists.
#
# AESL-HW-RT1170-EINK-SPEC Rev 0.7:
#   - SDRAM DNP (streaming / OCRAM)
#   - FlexSPI1 code + FlexSPI2 assets
#   - SPI EL133 only (no MIPI LCD preview)
#
# Not for MIMXRT1170-EVK LCD lab builds.

CONFIG_APP_EINK=y
CONFIG_APP_EINK_SHELL=y
CONFIG_APP_EINK_HTTP=y
CONFIG_APP_EINK_LZ4=y
CONFIG_APP_EINK_FULL_FRAMEBUFFER=n
CONFIG_APP_EINK_DISPLAY_LCD_PREVIEW=n
CONFIG_APP_EINK_BATTERY_DUTY_CYCLE=y
CONFIG_APP_EINK_OTA_FLASH_STAGING=y
CONFIG_APP_EINK_DISPLAY_FIRE_AND_FORGET=y
CONFIG_APP_EINK_STORE_ROOT="/lfs1/eink"

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FS_LITTLEFS_FSTAB_AUTOMOUNT=y

CONFIG_DISPLAY=y
CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_HEAP_MEM_POOL_SIZE=196608
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
# CM4 held in reset on product — never enable secondary core.
# CONFIG_SECOND_CORE_MCUX is not set
