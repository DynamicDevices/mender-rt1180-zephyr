# Shared Zephyr shell / UART console for RT1170 e-ink profiles.
# Mirrors native_sim eink-native-sim.conf (minus CONFIG_UART_NATIVE_PTY_*).
# USB CDC / MCU-Link serial @ 115200 — same eink shell commands as the sim.
#
# Avoid CONFIG_POSIX_SYSTEM_INTERFACES here: it pulls mbedtls inet_pton deps and
# is unnecessary once MCU code uses Zephyr fs_* instead of host fopen().
CONFIG_SHELL=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_SHELL_STACK_SIZE=24576
# fs ls /lfs1 … — requires FILE_SYSTEM (+ LittleFS) in the including profile.
CONFIG_FILE_SYSTEM_SHELL=y
# Shell + LittleFS + sockets need more than the default 5 FDs.
CONFIG_ZVFS_OPEN_MAX=16
