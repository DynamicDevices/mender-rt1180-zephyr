# FRDM-IMXRT1186 Spectra 6 SPI lab (CM33).
# Build: ./scripts/build-rt1186-frdm-eink.sh
#
# No full framebuffer: 1200×1600 L_4 is 960 KiB; stream via the EL133 driver.
# Not a battery / product profile.

CONFIG_APP_EINK=y
CONFIG_APP_EINK_SHELL=y
CONFIG_APP_EINK_FULL_FRAMEBUFFER=n
CONFIG_APP_EINK_DISPLAY_LCD_PREVIEW=n
CONFIG_APP_EINK_BATTERY_DUTY_CYCLE=n
# e-tabelone HTTP: default off (lab shell). Opt-in HyperRAM+MCUboot path:
#   FRDM_EINK_HTTP=1 ./scripts/build-rt1186-frdm-eink.sh
# (appends eink_hyperram.conf + eink_http.conf; do not use OCRAM enroll.)
CONFIG_APP_EINK_HTTP=n
CONFIG_APP_EINK_LOCATION=n
CONFIG_APP_EINK_LZ4=n
CONFIG_APP_EINK_IW612_GPIO=n
CONFIG_APP_EINK_PANEL_GPIO=n
CONFIG_APP_EINK_STORE_ROOT="/lfs1/eink"

CONFIG_DISPLAY=y
CONFIG_SPI=y
CONFIG_GPIO=y

# APP_EINK store/display/location call fs_*; shell fragment wants FILE_SYSTEM_SHELL.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y

CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_MAIN_STACK_SIZE=8192

# Lab UART: see netup/DHCP on MCU-Link without waiting for the deferred log thread.
CONFIG_LOG_MODE_DEFERRED=n
CONFIG_LOG_MODE_IMMEDIATE=y
