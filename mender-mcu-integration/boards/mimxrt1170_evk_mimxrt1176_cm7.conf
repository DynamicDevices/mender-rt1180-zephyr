####################################
# MIMXRT1170-EVK (Cortex-M7)
####################################

####################################
# NXP ENET Ethernet
####################################
# The board DTS enables the 10/100 ENET MAC and KSZ8081 PHY.
CONFIG_NET_L2_ETHERNET=y

# Keep a persistent hardware identity available for future per-unit identity.
CONFIG_HWINFO=y

# Proven i.MX RT ENET tuning for TLS + ~960 KiB ES6F gallery downloads.
# Larger fragments/windows cut radio/link awake time (power-critical).
CONFIG_ETH_NXP_ENET_RX_BUFFERS=16
CONFIG_ETH_NXP_ENET_TX_BUFFERS=8
CONFIG_NET_PKT_RX_COUNT=40
CONFIG_NET_PKT_TX_COUNT=40
CONFIG_NET_BUF_RX_COUNT=120
CONFIG_NET_BUF_TX_COUNT=120
CONFIG_NET_BUF_DATA_SIZE=1600
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=65535
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=32768

####################################
# MCUboot signing
####################################
CONFIG_MCUBOOT_SIGNATURE_KEY_FILE="bootloader/mcuboot/root-rsa-2048.pem"

####################################
# Mender storage
####################################
# Uses storage_partition from the upstream MIMXRT1170-EVK devicetree.
CONFIG_MENDER_STORAGE_PARTITION_STORAGE_PARTITION=y

####################################
# Zephyr shell (parity with native_sim e-ink)
####################################
# Interactive uart:~$ on MCU-Link / USB serial @ 115200.
# E-ink lab/product fragments add APP_EINK_SHELL + FILE_SYSTEM_SHELL.
CONFIG_SHELL=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_SHELL_STACK_SIZE=24576
CONFIG_ZVFS_OPEN_MAX=16
