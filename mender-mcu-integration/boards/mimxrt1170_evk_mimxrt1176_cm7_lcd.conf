# MIMXRT1170-EVK lab profile: Rocktech RK055HDMIPI4MA0 MIPI LCD preview.
# Mutually exclusive with LPSPI1 EL133 (LCDIF pinmux conflicts with lpspi1).
#
# Build: ./scripts/build-rt1170-evk-lcd.sh
# Requires: --shield rk055hdmipi4ma0 (passed by the build script)
#
# Lab-only: uses EVK SDRAM for the RGB565 preview framebuffer.
# Not a product / battery / Active ESL profile.
#
# Shell: same eink commands as native_sim (UART @ 115200 on MCU-Link).

CONFIG_APP_EINK=y
CONFIG_APP_EINK_SHELL=y
CONFIG_APP_EINK_HTTP=y
CONFIG_APP_EINK_SELFTEST=y
CONFIG_APP_EINK_LZ4=y
CONFIG_APP_EINK_DISPLAY_LCD_PREVIEW=y
CONFIG_APP_EINK_FULL_FRAMEBUFFER=n
CONFIG_APP_EINK_BATTERY_DUTY_CYCLE=n
CONFIG_APP_EINK_STORE_ROOT="/lfs1/eink"

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FS_LITTLEFS_FSTAB_AUTOMOUNT=y
CONFIG_FILE_SYSTEM_SHELL=y

CONFIG_DISPLAY=y
CONFIG_MIPI_DSI=y
CONFIG_HEAP_MEM_POOL_SIZE=1048576
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
