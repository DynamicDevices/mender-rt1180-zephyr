####################################
# FRDM e-ink — T2000 USB host MVP
####################################
# Pair with HyperRAM (eink_hyperram.conf) and eink_t2000.overlay.
# Do not enable UDC on the same EHCI instance.

CONFIG_UHC_DRIVER=y
CONFIG_UHC_NXP_EHCI=y
CONFIG_USB_HOST_STACK=y
CONFIG_USBH_SHELL=y

CONFIG_UHC_BUF_POOL_SIZE=16384
CONFIG_UHC_XFER_COUNT=16
CONFIG_UHC_BUF_COUNT=16
CONFIG_USBH_USB_DEVICE_HEAP=8192

CONFIG_APP_EINK_T2000=y
