# FRDM CM33: keep MCUboot in on-chip DTCM (see cm33_sram_dtcm.overlay).
# HyperRAM is fine for the app, but MCUboot + FlexSPI NOR init is more
# reliable with DTCM as zephyr,sram (avoids flash_area_open -ENODEV).
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
# Point VTOR at the app vector table before do_boot() jump (clean handoff).
CONFIG_BOOT_INTR_VEC_RELOC=y
