####################################
# FRDM CM33 OCRAM enroll (opt-in)
# Pair with boards/frdm_imxrt1186_mimxrt1186_cm33_ocram.overlay
# Enable via: FRDM_ENROLL_OCRAM=1 ./scripts/build-rt1186-frdm.sh
####################################

# Default Mender net bufs (~547 KiB) do not fit OCRAM1 (~496 KiB available).
CONFIG_NET_PKT_RX_COUNT=24
CONFIG_NET_PKT_TX_COUNT=24
CONFIG_NET_BUF_RX_COUNT=48
CONFIG_NET_BUF_TX_COUNT=48
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=8192
CONFIG_PRINTK=y
CONFIG_EXCEPTION_STACK_TRACE=y
# UART log backend SYS_INIT faulted on FRDM after MCUboot (lockup in
# log_backend_uart_init). Keep backend but do not autostart; printk/banner OK.
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_UART_AUTOSTART=n
CONFIG_EARLY_CONSOLE=n

# FlexSPI NOR: avoid relocating MEMC/ccm into HyperRAM (UsageFault under MPU XN
# when zephyr,sram was HyperRAM). With OCRAM sram this stays conservative.
CONFIG_CODE_DATA_RELOCATION=n
CONFIG_CODE_DATA_RELOCATION_SRAM=n
CONFIG_FLASH_MCUX_FLEXSPI_XIP_MEM="RAM"
