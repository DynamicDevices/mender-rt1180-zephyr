# Duty-cycle smoke for native_sim (schedule-driven next_wake; SNVS stub returns).
# Overlay on top of eink-native-sim.conf via EXTRA_CONF_FILE.
CONFIG_APP_EINK_BATTERY_DUTY_CYCLE=y
CONFIG_APP_EINK_SNVS_SIM_HOLD_SEC=0
CONFIG_APP_EINK_HTTP_ENABLE=y
CONFIG_APP_EINK_HTTP_BASE_URL="file:///tmp/eink-fixture"
CONFIG_APP_EINK_HTTP_DEVICE_ID="sim-duty"
CONFIG_APP_EINK_HTTP_AUTH_TOKEN=""
CONFIG_APP_EINK_HTTP_POLL_INTERVAL=300
# Focused smoke: skip Mender always-on after wake returns.
CONFIG_APP_MENDER_CLIENT_ENABLE=n
