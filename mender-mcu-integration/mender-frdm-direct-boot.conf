# Advanced: direct ROM boot (no MCUboot) for FRDM enroll smoke.
# Not wired into build-rt1186-frdm.sh — pass as EXTRA_CONF_FILE manually if needed.
CONFIG_BOOTLOADER_MCUBOOT=n
CONFIG_FLASH_LOAD_OFFSET=0
CONFIG_FLASH_LOAD_SIZE=0
CONFIG_MENDER_ZEPHYR_IMAGE_UPDATE_MODULE=n
CONFIG_MENDER_APP_NOOP_UPDATE_MODULE=y
CONFIG_MENDER_ARTIFACT_GENERATE=n
# Avoid FlexSPI drivers in HyperRAM (UsageFault under MPU XN).
CONFIG_CODE_DATA_RELOCATION=n
CONFIG_CODE_DATA_RELOCATION_SRAM=n
