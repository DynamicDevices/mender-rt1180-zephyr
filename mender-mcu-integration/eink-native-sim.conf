####################################
# native_sim + e-ink + scheduler
####################################
CONFIG_APP_EINK=y
CONFIG_APP_EINK_SHELL=y
CONFIG_APP_EINK_HTTP=y
CONFIG_APP_EINK_SELFTEST=y
CONFIG_APP_EINK_FULL_FRAMEBUFFER=n
CONFIG_APP_EINK_STORE_ROOT="/lfs1/eink"

# 32 MiB simulated NOR; the overlay gives e-ink a 17.75 MiB LittleFS
# partition after MCUboot, A/B OTA slots, and a separate Mender NVS partition.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FS_LITTLEFS_FSTAB_AUTOMOUNT=y
CONFIG_FILE_SYSTEM_SHELL=y

CONFIG_DISPLAY=y
CONFIG_DUMMY_DISPLAY=y

CONFIG_SHELL=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# Map console to stdin/stdout so the shell is scriptable in CI
CONFIG_UART_NATIVE_PTY_0_ON_STDINOUT=y

CONFIG_HEAP_MEM_POOL_SIZE=200000
CONFIG_MAIN_STACK_SIZE=8192
# TLS handshake + HTTP client need headroom on the shell path (eink sync).
CONFIG_SHELL_STACK_SIZE=24576
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

CONFIG_MENDER_APP_NOOP_UPDATE_MODULE=y
# Keep the focused e-tabelone simulator deterministic. Mender has separate
# native_sim/EVK profiles and remains part of the production integration.
CONFIG_APP_MENDER_CLIENT_ENABLE=n

# e-tabelone HTTP client stack (sync off until credentials provided)
CONFIG_HTTP_CLIENT=y
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_SERVER_IP_ADDRESSES=y
# Prefer the TAP host resolver (dnsmasq on 192.0.2.2) over a remote DNS RTT.
CONFIG_DNS_SERVER1="192.0.2.2"
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
# Skip DHCPv4's RFC 1–10s random discover delay on the fixed zeth subnet.
CONFIG_NET_DHCPV4=n
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.0.2.24"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.0.2.2"
# ES6F frames are ~960 KiB. Default native_sim net pools (128 B fragments,
# ~14 pkts) crawl at ~25 KiB/s — minutes awake per gallery sync. Match the
# proven Wi-Fi download tuning so radio/sim wake stays seconds-class.
CONFIG_NET_PKT_RX_COUNT=40
CONFIG_NET_PKT_TX_COUNT=40
CONFIG_NET_BUF_RX_COUNT=120
CONFIG_NET_BUF_TX_COUNT=120
CONFIG_NET_BUF_DATA_SIZE=1600
# Larger windows for ~960 KiB ES6F pulls (fewer ACK round-trips).
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=65535
CONFIG_NET_TCP_MAX_SEND_WINDOW_SIZE=32768
CONFIG_APP_EINK_HTTP_ENABLE=n
# Cloudflare Etablone (prod). Legacy AWS: https://api.dev.e-tabelone.com
# Override anytime: eink creds <base> <id> <token>
CONFIG_APP_EINK_HTTP_BASE_URL="https://etablone.dynamicdevices.co.uk"

# Amazon RSA leaf/intermediate verify via PSA (ECDHE-RSA-AES128-GCM-SHA256).
CONFIG_PSA_WANT_KEY_TYPE_RSA_PUBLIC_KEY=y
# api.dev.e-tabelone.com / hosted.mender.io negotiate X25519 for ECDHE.
# Without this, PSA keygen fails as MBEDTLS_ERR_SSL_HW_ACCEL_FAILED (-0x7F80).
CONFIG_PSA_WANT_ECC_MONTGOMERY_255=y
CONFIG_MBEDTLS_HEAP_SIZE=98304

# Extra arena for mbedTLS handshake / HTTP client
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=131072

# S3 pre-signed URLs are time-bound; native_sim boots at unix 0 without this.
CONFIG_SNTP=y
CONFIG_APP_EINK_HTTP_SNTP_SERVER="pool.ntp.org"

