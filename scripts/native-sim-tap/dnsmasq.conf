# DHCP (+ DNS) for Zephyr native_sim TAP zeth. Bound to the interface only so
# it does not fight systemd-resolved on 127.0.0.53.
interface=zeth
bind-interfaces
except-interface=lo
port=53

address=/4.zephyr.test/192.0.2.2
address=/6.zephyr.test/2001:db8::2
domain=zephyr.test
dhcp-range=192.0.2.16,192.0.2.32,1h
